<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 980" role="img" aria-labelledby="title desc"><title id="title">CareSync use-case diagram</title><desc id="desc">Five human actor roles and Gmail SMTP participate in selected role-scoped system use cases.</desc><rect width="1420" height="980" fill="white"/><g font-family="Arial, sans-serif" fill="#0f172a"><rect x="270" y="35" width="900" height="885" rx="4" fill="none" stroke="#334155" stroke-width="2"/><text x="720" y="74" text-anchor="middle" font-weight="bold" font-size="24">CareSync system boundary</text><ellipse cx="450" cy="155" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="450" y="149" text-anchor="middle" font-size="19"><tspan x="450" dy="0">Book or resubmit</tspan><tspan x="450" dy="24">own request</tspan></text><path d="M160,155 L325,155" stroke="#64748b" fill="none"/><ellipse cx="725" cy="155" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="725" y="149" text-anchor="middle" font-size="19"><tspan x="725" dy="0">Read own records</tspan><tspan x="725" dy="24">and version history</tspan></text><path d="M160,145 L250,90 L725,90 L725,106" stroke="#64748b" fill="none"/><ellipse cx="1000" cy="155" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="1000" y="149" text-anchor="middle" font-size="19"><tspan x="1000" dy="0">Reply and read</tspan><tspan x="1000" dy="24">private inbox</tspan></text><path d="M160,165 L250,220 L1000,220 L1000,204" stroke="#64748b" fill="none"/><ellipse cx="450" cy="315" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="450" y="309" text-anchor="middle" font-size="19"><tspan x="450" dy="0">Manage own</tspan><tspan x="450" dy="24">availability</tspan></text><path d="M160,315 L325,315" stroke="#64748b" fill="none"/><ellipse cx="725" cy="315" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="725" y="309" text-anchor="middle" font-size="19"><tspan x="725" dy="0">Conduct assigned</tspan><tspan x="725" dy="24">consultation</tspan></text><path d="M160,305 L250,250 L725,250 L725,266" stroke="#64748b" fill="none"/><ellipse cx="1000" cy="315" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="1000" y="309" text-anchor="middle" font-size="19"><tspan x="1000" dy="0">View assigned</tspan><tspan x="1000" dy="24">records and reports</tspan></text><path d="M160,325 L250,380 L1000,380 L1000,364" stroke="#64748b" fill="none"/><ellipse cx="450" cy="475" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="450" y="469" text-anchor="middle" font-size="19"><tspan x="450" dy="0">Review, correct</tspan><tspan x="450" dy="24">and assign bookings</tspan></text><path d="M160,475 L325,475" stroke="#64748b" fill="none"/><ellipse cx="725" cy="475" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="725" y="469" text-anchor="middle" font-size="19"><tspan x="725" dy="0">Register walk-ins</tspan><tspan x="725" dy="24">and arrivals</tspan></text><path d="M160,465 L250,410 L725,410 L725,426" stroke="#64748b" fill="none"/><ellipse cx="1000" cy="475" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="1000" y="469" text-anchor="middle" font-size="19"><tspan x="1000" dy="0">Manage clinic</tspan><tspan x="1000" dy="24">records and reports</tspan></text><path d="M160,485 L250,540 L1000,540 L1000,524" stroke="#64748b" fill="none"/><ellipse cx="450" cy="635" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="450" y="629" text-anchor="middle" font-size="19"><tspan x="450" dy="0">Maintain accounts</tspan><tspan x="450" dy="24">and roles</tspan></text><path d="M160,635 L325,635" stroke="#64748b" fill="none"/><ellipse cx="725" cy="635" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="725" y="641" text-anchor="middle" font-size="19"><tspan x="725" dy="0">Inspect audit logs</tspan></text><path d="M160,625 L250,570 L725,570 L725,586" stroke="#64748b" fill="none"/><ellipse cx="1000" cy="635" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="1000" y="629" text-anchor="middle" font-size="19"><tspan x="1000" dy="0">Perform clinic</tspan><tspan x="1000" dy="24">operations</tspan></text><path d="M160,645 L250,700 L1000,700 L1000,684" stroke="#64748b" fill="none"/><ellipse cx="450" cy="800" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="450" y="794" text-anchor="middle" font-size="19"><tspan x="450" dy="0">Read ticket-only</tspan><tspan x="450" dy="24">public queue</tspan></text><path d="M160,800 L325,800" stroke="#64748b" fill="none"/><ellipse cx="1000" cy="800" rx="125" ry="49" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><text x="1000" y="794" text-anchor="middle" font-size="19"><tspan x="1000" dy="0">Send OTP and eligible</tspan><tspan x="1000" dy="24">appointment email</tspan></text><path d="M1125,800 H1250" stroke="#64748b" fill="none"/><g fill="none" stroke="#334155" stroke-width="2"><circle cx="125" cy="113" r="15"/><path d="M125,128v45m-27,-27h54m-27,27l-25,35m25,-35l25,35"/></g><text x="125" y="222" text-anchor="middle" font-size="20">Patient</text><g fill="none" stroke="#334155" stroke-width="2"><circle cx="125" cy="273" r="15"/><path d="M125,288v45m-27,-27h54m-27,27l-25,35m25,-35l25,35"/></g><text x="125" y="382" text-anchor="middle" font-size="20">Doctor</text><g fill="none" stroke="#334155" stroke-width="2"><circle cx="125" cy="433" r="15"/><path d="M125,448v45m-27,-27h54m-27,27l-25,35m25,-35l25,35"/></g><text x="125" y="542" text-anchor="middle" font-size="20">Staff</text><g fill="none" stroke="#334155" stroke-width="2"><circle cx="125" cy="593" r="15"/><path d="M125,608v45m-27,-27h54m-27,27l-25,35m25,-35l25,35"/></g><text x="125" y="702" text-anchor="middle" font-size="20">Admin</text><g fill="none" stroke="#334155" stroke-width="2"><circle cx="125" cy="758" r="15"/><path d="M125,773v45m-27,-27h54m-27,27l-25,35m25,-35l25,35"/></g><text x="125" y="867" text-anchor="middle" font-size="20">Public viewer</text><g fill="none" stroke="#334155" stroke-width="2"><circle cx="1300" cy="758" r="15"/><path d="M1300,773v45m-27,-27h54m-27,27l-25,35m25,-35l25,35"/></g><text x="1300" y="867" text-anchor="middle" font-size="20">Gmail SMTP</text><text x="720" y="955" text-anchor="middle" font-size="18">Selected use cases; actor permissions also depend on ownership, assignment and current state.</text></g></svg>
